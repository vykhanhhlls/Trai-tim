<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Particles Pink Random - GitHub</title>
<style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
// Cấu hình
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
const particles = [];
const particleCount = 2500;        // Số lượng chấm (càng nhiều càng đẹp)
const colors = ['#ff69b4', '#ff1493', '#db7093', '#ffb6c1', '#ff00ff'];

class Particle {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = width / 2 + (Math.random() - 0.5) * 400;
        this.y = height / 2 + (Math.random() - 0.5) * 400;
        
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = (Math.random() - 0.5) * 1.5;
        
        this.size = Math.random() * 2.5 + 0.8;
        this.alpha = Math.random() * 0.8 + 0.4;
        this.color = colors[Math.floor(Math.random() * colors.length)];
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        // Rung ngẫu nhiên (random movement)
        this.vx += (Math.random() - 0.5) * 0.15;
        this.vy += (Math.random() - 0.5) * 0.15;

        // Giới hạn tốc độ
        this.vx = Math.max(Math.min(this.vx, 3), -3);
        this.vy = Math.max(Math.min(this.vy, 3), -3);

        // Bounce khi chạm viền
        if (this.x < 0 || this.x > width) this.vx *= -0.95;
        if (this.y < 0 || this.y > height) this.vy *= -0.95;

        // Fade nhẹ
        this.alpha = Math.max(0.3, this.alpha - 0.0005);
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// Khởi tạo
function init() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    particles.length = 0;
    for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
    }
}

// Animation loop
function animate() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';  // Tạo hiệu ứng đuôi
    ctx.fillRect(0, 0, width, height);

    for (let p of particles) {
        p.update();
        p.draw();

        // Reset particle khi ra ngoài quá xa
        if (p.x < -100 || p.x > width + 100 || p.y < -100 || p.y > height + 100) {
            p.reset();
        }
    }

    requestAnimationFrame(animate);
}

// Resize window
window.addEventListener('resize', () => {
    init();
});

// Khởi chạy
init();
animate();
</script>

</body>
</html>
