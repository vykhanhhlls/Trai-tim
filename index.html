<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dear My Love</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #050505; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        /* Canvas chứa hiệu ứng 3D nền */
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        /* Hiệu ứng chữ Glitch (Giống giây 0:07) */
        #glitch-text-container { position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%); z-index: 5; text-align: center; width: 100%; }
        .glitch-text { font-size: 2.3rem; font-weight: 900; text-transform: uppercase; position: relative; color: #ff5e97; text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff, 0.025em 0.04em 0 #fffc00; animation: glitch 725ms infinite; text-align: center; line-height: 1.4; }
        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff, 0.025em 0.04em 0 #fffc00; }
            14% { text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff, 0.025em 0.04em 0 #fffc00; }
            15% { text-shadow: -0.05em -0.025em 0 #00fffc, 0.025em 0.025em 0 #fc00ff, -0.05em -0.05em 0 #fffc00; }
            49% { text-shadow: -0.05em -0.025em 0 #00fffc, 0.025em 0.025em 0 #fc00ff, -0.05em -0.05em 0 #fffc00; }
            50% { text-shadow: 0.025em 0.05em 0 #00fffc, 0.05em 0 0 #fc00ff, 0.05em -0.025em 0 #fffc00; }
            99% { text-shadow: 0.025em 0.05em 0 #00fffc, 0.05em 0 0 #fc00ff, 0.05em -0.025em 0 #fffc00; }
            100% { text-shadow: -0.025em 0 0 #00fffc, -0.025em -0.025em 0 #fc00ff, -0.025em -0.05em 0 #fffc00; }
        }
        /* Phong bì thư & Lời chúc (Giống giây 0:20) */
        #envelope-container { position: fixed; bottom: 8%; left: 50%; transform: translateX(-50%); z-index: 10; width: 90%; max-width: 500px; text-align: center; }
        .heart-btn { width: 60px; height: 60px; background: #ff477e; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 15px auto; cursor: pointer; box-shadow: 0 0 20px #ff477e; font-size: 24px; animation: pulse 1.5s infinite; transition: 0.3s; }
        .heart-btn:hover { transform: scale(1.1); }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 126, 0.7); } 70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(255, 71, 126, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 126, 0); } }
        
        .letter { background: rgba(255, 255, 255, 0.95); color: #333; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: left; max-height: 260px; overflow-y: auto; display: none; border-left: 5px solid #ff477e; }
        .letter h3 { color: #ff477e; margin-bottom: 10px; font-size: 1.1rem; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
        .letter p { font-size: 0.95rem; line-height: 1.6; white-space: pre-line; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="glitch-text-container">
        <div class="glitch-text">Chúc Mừng<br>Ngày Quốc Tế Thiếu Nhi</div>
    </div>
    <div id="envelope-container">
        <div class="heart-btn" id="open-letter-btn" onclick="openLetter()">💌</div>
        <div class="letter" id="secret-letter">
            <h3>Hôm nay: 01-06-2026</h3>
            <p id="typing-text"></p>
        </div>
    </div>
    <script>
        // Địa chỉ link ảnh (Bạn thay bằng link ảnh thật của bạn gái nhé)
        const sampleImages = [
            'https://picsum.photos/id/1025/300/300',
            'https://picsum.photos/id/64/300/300',
            'https://picsum.photos/id/1062/300/300',
            'https://picsum.photos/id/1084/300/300',
            'https://picsum.photos/id/169/300/300',
            'https://picsum.photos/id/219/300/300'
        ];
        const loveLetterText = `Gửi em bé ngoan số 1 thế giới của anh, \n\nChúc bạn nhỏ của tui mau ăn chóng lớn và ngoan ngoãn nhé. Luôn vui vẻ, nở nụ cười trên môi và đặc biệt là không được tiêu cực ạ. \n\nThương bạn nhỏ của anh rất nhiều! ❤️`;
        let scene, camera, renderer, starGeometry, starField, imageGroup;
        function init3DSpace() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 150;
            renderer = new THREE.WebGLRenderer({ alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            // 1. Tạo dải ngân hà hạt lấp lánh (Tinh vân hồng giống giây 0:03)
            starGeometry = new THREE.BufferGeometry();
            const starCount = 3500;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i+=3) {
                const radius = Math.random() * 130;
                const theta = Math.random() * Math.PI * 2;
                positions[i] = Math.cos(theta) * radius;
                positions[i+1] = Math.sin(theta) * radius;
                positions[i+2] = (Math.random() - 0.5) * 120;
                // Tone màu hồng - hồng cam - tím lấp lánh giống video
                colors[i] = 1.0; 
                colors[i+1] = Math.random() * 0.35;
                colors[i+2] = 0.5 + Math.random() * 0.5;
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const pMaterial = new THREE.PointsMaterial({
                size: 1.6,
                vertexColors: true,
                transparent: true,
                opacity: 0.85
            });
            starField = new THREE.Points(starGeometry, pMaterial);
            scene.add(starField);
            // 2. Tạo quả cầu ảnh xoay vòng (Photo Sphere giống giây 0:11)
            imageGroup = new THREE.Group();
            const textureLoader = new THREE.TextureLoader();
            sampleImages.forEach((url, index) => {
                textureLoader.load(url, function(texture) {
                    const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                    const geometry = new THREE.PlaneGeometry(22, 22);
                    const mesh = new THREE.Mesh(geometry, material);
                    const phi = Math.acos(-1 + (2 * index) / sampleImages.length);
                    const theta = Math.sqrt(sampleImages.length * Math.PI) * phi;
                    mesh.position.set(
                        45 * Math.sin(phi) * Math.sin(theta),
                        45 * Math.cos(phi),
                        45 * Math.sin(phi) * Math.cos(theta)
                    );
                    mesh.lookAt(0, 0, 0);
                    imageGroup.add(mesh);
                });
            });
            scene.add(imageGroup);
            imageGroup.position.set(0, -5, -40); // Cân chỉnh vị trí trung tâm vừa tầm nhìn
            window.addEventListener('resize', onWindowResize);
            animate();
        }
        function animate() {
            requestAnimationFrame(animate);
            // Xoay dải hạt nền ngôi sao
            starField.rotation.z += 0.0015;
            starField.rotation.y += 0.0008;
            // Xoay khối ảnh 3D lơ lửng
            if(imageGroup) {
                imageGroup.rotation.y += 0.004;
                imageGroup.rotation.x += 0.0015;
            }
            renderer.render(scene, camera);
        }
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        // Tự động chạy ngay khi load trang trang web
        window.onload = () => {
            init3DSpace();
        };
        // Hiệu ứng đánh máy chữ tự động khi mở thư
        let textIdx = 0;
        function typeWriter() {
            if (textIdx < loveLetterText.length) {
                document.getElementById("typing-text").innerHTML += loveLetterText.charAt(textIdx);
                textIdx++;
                setTimeout(typeWriter, 45); 
            }
        }
        function openLetter() {
            document.getElementById('open-letter-btn').style.display = 'none';
            document.getElementById('secret-letter').style.display = 'block';
            typeWriter();
        }
    </script>
</body>
</html>
