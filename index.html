<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dear My Love</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0d0208; 
            color: #fff; 
            font-family: 'Quicksand', sans-serif; 
            overflow: hidden; 
            perspective: 1000px;
        }
        
        /* Bộ lọc tạo hiệu ứng điện ảnh như video (Tối 4 góc) */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }
        /* Canvas chứa hiệu ứng 3D */
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        /* Khung chữ Glitch Neon nghệ thuật giống video */
        #glitch-text-container { 
            position: fixed; 
            top: 22%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            z-index: 5; 
            text-align: center; 
            width: 90%; 
            pointer-events: none;
        }
        .glitch-text { 
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            position: relative; 
            color: #ff75a0; 
            text-shadow: 0 0 10px rgba(255,117,160,0.6), 0.05em 0 0 #00ffff, -0.03em -0.04em 0 #ff007f; 
            animation: glitch 900ms infinite; 
            line-height: 1.3; 
        }
        @keyframes glitch {
            0% { text-shadow: 0 0 10px rgba(255,117,160,0.6), 0.05em 0 0 #00ffff, -0.03em -0.04em 0 #ff007f; }
            15% { text-shadow: 0 0 10px rgba(255,117,160,0.6), 0.05em 0 0 #00ffff, -0.03em -0.04em 0 #ff007f; }
            16% { text-shadow: -0.05em -0.025em 0 #00ffff, 0.025em 0.025em 0 #ff007f; }
            49% { text-shadow: -0.05em -0.025em 0 #00ffff, 0.025em 0.025em 0 #ff007f; }
            50% { text-shadow: 0.025em 0.05em 0 #00ffff, 0.05em 0 0 #ff007f; }
            99% { text-shadow: 0.025em 0.05em 0 #00ffff, 0.05em 0 0 #ff007f; }
            100% { text-shadow: -0.025em 0 0 #00ffff, -0.025em -0.025em 0 #ff007f; }
        }
        /* Nút mở thư hình trái tim lấp lánh lung linh */
        #envelope-container { 
            position: fixed; 
            bottom: 12%; 
            left: 50%; 
            transform: translateX(-50%); 
            z-index: 10; 
            width: 90%; 
            max-width: 440px; 
            text-align: center; 
        }
        .heart-btn { 
            width: 65px; 
            height: 65px; 
            background: linear-gradient(45deg, #ff477e, #ff75a0); 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: 0 auto 20px auto; 
            cursor: pointer; 
            box-shadow: 0 0 25px #ff477e, inset 0 0 10px rgba(255,255,255,0.5); 
            font-size: 26px; 
            animation: pulse 1.4s infinite; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .heart-btn:hover { transform: scale(1.15) rotate(10deg); box-shadow: 0 0 35px #ff75a0; }
        @keyframes pulse { 
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 126, 0.8); } 
            70% { transform: scale(1.08); box-shadow: 0 0 0 18px rgba(255, 71, 126, 0); } 
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 126, 0); } 
        }
        
        /* Giao diện bức thư kính mờ cao cấp (Glassmorphism) cực lãng mạn */
        .letter { 
            background: rgba(15, 5, 10, 0.75); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff; 
            padding: 28px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 1px 1px rgba(255,255,255,0.15); 
            text-align: left; 
            max-height: 280px; 
            overflow-y: auto; 
            display: none; 
            border-top: 4px solid #ff477e;
            animation: slideUp 0.6s ease forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .letter h3 { 
            font-family: 'Montserrat', sans-serif;
            color: #ff75a0; 
            margin-bottom: 12px; 
            font-size: 1rem; 
            letter-spacing: 1px;
            border-bottom: 1px dashed rgba(255,117,160,0.3); 
            padding-bottom: 8px; 
        }
        .letter p { 
            font-size: 0.95rem; 
            line-height: 1.7; 
            white-space: pre-line; 
            letter-spacing: 0.5px;
            color: #f0e6ec;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="glitch-text-container">
        <div class="glitch-text">Ngày Quốc Tế<br>Thiếu Nhi</div>
    </div>
    <div id="envelope-container">
        <div class="heart-btn" id="open-letter-btn" onclick="openLetter()">💌</div>
        <div class="letter" id="secret-letter">
            <h3>Hôm nay: 01-06-2026</h3>
            <p id="typing-text"></p>
        </div>
    </div>
    <script>
        // Tên các file ảnh bạn đã tải lên cùng thư mục trên GitHub
        // Bạn hãy thay đổi tên file cho chuẩn xác với ảnh của bạn nhé
        const imageFiles = [
            'anh1.jpg',
            'anh2.jpg',
            'anh3.jpg',
            'anh4.jpg',
            'anh5.jpg',
            'anh6.jpg'
        ];
        // Lời chúc chạy chữ tự động ngọt ngào
        const loveLetterText = `Gửi em bé ngoan số 1 thế giới của anh, \n\nChúc bạn nhỏ của tui mau ăn chóng lớn và luôn ngoan ngoãn nhé. Lúc nào cũng phải thật vui vẻ, luôn nở nụ cười tươi trên môi và đặc biệt là không bao giờ được suy nghĩ tiêu cực đâu đấy ạ. \n\nThương bạn nhỏ của anh nhất trên đời! ❤️`;
        let scene, camera, renderer, starGeometry, starField, imageGroup;
        function init3DSpace() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            
            // Tạo hiệu ứng sương mù màu hồng tối để tăng độ sâu không gian nghệ thuật
            scene.fog = new THREE.FogExp2(0x0d0208, 0.0035);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 140;
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            // 1. DẢI NGÂN HÀ HẠT LẤP LÁNH (Tinh vân hồng giống giây 0:03)
            starGeometry = new THREE.BufferGeometry();
            const starCount = 4000; // Tăng số lượng hạt nhìn cho dày dặn, lấp lánh hơn
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i+=3) {
                const radius = Math.random() * 140;
                const theta = Math.random() * Math.PI * 2;
                positions[i] = Math.cos(theta) * radius;
                positions[i+1] = Math.sin(theta) * radius;
                positions[i+2] = (Math.random() - 0.5) * 140;
                // Phối màu hạt: Hồng neon, Tím nhạt và Trắng ánh kim lấp lánh
                const rand = Math.random();
                if (rand > 0.5) {
                    colors[i] = 1.0; colors[i+1] = 0.2; colors[i+2] = 0.6; // Hồng
                } else if (rand > 0.2) {
                    colors[i] = 0.7; colors[i+1] = 0.3; colors[i+2] = 0.9; // Tím
                } else {
                    colors[i] = 1.0; colors[i+1] = 0.9; colors[i+2] = 1.0; // Trắng sáng
                }
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const pMaterial = new THREE.PointsMaterial({
                size: 1.4,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending // Tạo hiệu ứng phát sáng cộng hưởng hạt cực đẹp
            });
            starField = new THREE.Points(starGeometry, pMaterial);
            scene.add(starField);
            // 2. KHỐI ẢNH 3D XOAY VÒNG (Photo Sphere lãng mạn giống giây 0:11)
            imageGroup = new THREE.Group();
            const textureLoader = new THREE.TextureLoader();
            // Lặp gấp đôi số lượng ảnh để vòng tròn ảnh trông dày và đẹp hơn
            const doubleImages = [...imageFiles, ...imageFiles]; 
            doubleImages.forEach((url, index) => {
                textureLoader.load(url, function(texture) {
                    // Cân chỉnh tỉ lệ ảnh mịn màng mượt mà
                    texture.minFilter = THREE.LinearFilter;
                    
                    const material = new THREE.MeshBasicMaterial({ 
                        map: texture, 
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.95
                    });
                    
                    // Tạo khung ảnh vuông vắn nhỏ nhắn xinh xắn
                    const geometry = new THREE.PlaneGeometry(24, 24);
                    const mesh = new THREE.Mesh(geometry, material);
                    // Thuật toán tính toán vị trí phân bổ ảnh đều thành khối cầu
                    const phi = Math.acos(-1 + (2 * index) / doubleImages.length);
                    const theta = Math.sqrt(doubleImages.length * Math.PI) * phi;
                    mesh.position.set(
                        48 * Math.sin(phi) * Math.sin(theta),
                        48 * Math.cos(phi),
                        48 * Math.sin(phi) * Math.cos(theta)
                    );
                    mesh.lookAt(0, 0, 0);
                    imageGroup.add(mesh);
                }, undefined, function (err) {
                    console.log("Không tìm thấy file ảnh: " + url + ". Hãy kiểm tra lại tên file viết hoa/thường.");
                });
            });
            
            scene.add(imageGroup);
            imageGroup.position.set(0, -6, -35); // Cân đối vị trí ảnh ở trung tâm màn hình điện thoại/máy tính
            window.addEventListener('resize', onWindowResize);
            animate();
        }
        // Vòng lặp chuyển động mượt mà liên tục hàng giây
        function animate() {
            requestAnimationFrame(animate);
            // Xoay nhẹ bầu trời sao nền tinh vân hồng
            starField.rotation.z += 0.001;
            starField.rotation.y += 0.0005;
            // Xoay khối ảnh của bạn gái lơ lửng chậm rãi sang trọng
            if(imageGroup) {
                imageGroup.rotation.y += 0.0035;
                imageGroup.rotation.x += 0.001;
            }
            renderer.render(scene, camera);
        }
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        // Tự động chạy ngay lập tức khi load xong trang web
        window.onload = () => {
            init3DSpace();
        };
        // Hiệu ứng máy đánh chữ chạy từng ký tự
        let textIdx = 0;
        function typeWriter() {
            if (textIdx < loveLetterText.length) {
                document.getElementById("typing-text").innerHTML += loveLetterText.charAt(textIdx);
                textIdx++;
                setTimeout(typeWriter, 50); // Tốc độ xuất hiện chữ (50 mili giây)
            }
        }
        function openLetter() {
            document.getElementById('open-letter-btn').style.display = 'none';
            document.getElementById('secret-letter').style.display = 'block';
            typeWriter();
        }
    </script>
</body>
</html>
